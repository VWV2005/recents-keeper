name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches the JDK this module was verified against. The build only
          # needs javac/jar/keytool and the build-tools' d8.
          java-version: '11'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      # Signed with a throwaway debug key, so this artifact is for testing the
      # build only - release builds should be signed with your own key.
      - uses: actions/upload-artifact@v4
        with:
          name: RecentsKeeper-apk
          path: RecentsKeeper.apk
          if-no-files-found: error
