name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Pinned to the JDK this build was verified against locally.
          java-version: '11'

      # The runner image already ships an Android SDK with ANDROID_HOME set, so
      # nothing is installed here on purpose: pulling in cmdline-tools would drag
      # in sdkmanager, which requires JDK 17+ and would conflict with the JDK
      # above. build.sh discovers the newest build-tools and platform itself.
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- build-tools ---"; ls "$ANDROID_HOME/build-tools" || true
          echo "--- platforms ---";   ls "$ANDROID_HOME/platforms" || true

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      # Signed with a throwaway debug key, so this artifact is for checking that
      # the tree compiles and installs - sign your own releases with your key.
      - uses: actions/upload-artifact@v4
        with:
          name: RecentsKeeper-apk
          path: RecentsKeeper.apk
          if-no-files-found: error
